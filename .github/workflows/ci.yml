name: C/C++ CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build main server
      run: make

    - name: Build A-side tests
      run: make test

    - name: 1. Config Parser Tests
      run: ./test_config

    - name: 2. Server Setup Tests
      run: ./test_setup

    - name: 3. HTTP Parser Tests
      run: ./test_parser

    - name: B1 Router Tests
      run: make router

    - name: B2 Static File Tests
      run: make b2

    - name: B3 Upload / DELETE Tests
      run: make b3

    - name: B4 CGI Tests
      run: make b4
