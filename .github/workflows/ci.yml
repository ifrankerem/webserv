name: C/C++ CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build main server
      run: make

    - name: Build A-side tests
      if: success() || failure()
      run: make test

    - name: 1. Config Parser Tests
      if: success() || failure()
      run: ./test_config

    - name: 2. Server Setup Tests
      if: success() || failure()
      run: ./test_setup

    - name: 3. HTTP Parser Tests
      if: success() || failure()
      run: ./test_parser

    - name: B1 Router Tests
      if: success() || failure()
      run: ./webserv_router

    - name: B2 Static File Tests
      if: success() || failure()
      run: ./webserv_b2

    - name: B3 Upload / DELETE Tests
      if: success() || failure()
      run: ./webserv_b3

    - name: B4 CGI Tests
      if: success() || failure()
      run: ./webserv_b4

    - name: Multi-CGI Parser Tests
      if: success() || failure()
      run: ./webserv_multi_cgi

    - name: Setup 42 tester environment
      if: success() || failure()
      run: |
        mkdir -p YoupiBanane/nop YoupiBanane/Yeah
        touch YoupiBanane/youpi.bad_extension
        touch YoupiBanane/youpi.bla
        touch YoupiBanane/nop/youpi.bad_extension
        touch YoupiBanane/nop/other.pouic
        touch YoupiBanane/Yeah/not_happy.bad_extension
        chmod +x tester_42 cgi_tester_42

    - name: Run 42 webserv tester
      if: success() || failure()
      # normal run is ~5 min; without this a hung test burns the 6 h default
      timeout-minutes: 20
      run: |
        ./webserv conf/tester_42.conf > /dev/null 2>&1 &
        WS=$!
        sleep 1
        # every 30 s: memory and process state, so a hang shows where it stopped
        ( while sleep 30; do
            echo "[mon] $(free -m | awk '/Mem/{print "used="$3"MB avail="$7"MB"}') webserv_rss=$(ps -o rss= -p $WS 2>/dev/null)KB cgi=$(pgrep -c cgi_tester || true)"
          done ) &
        MON=$!
        # every 0.5 s: time, webserv RSS kB, sum of CGI children RSS kB, current test kind
        echo plain > test_kind
        ( while kill -0 $WS 2>/dev/null; do
            echo "$(date +%s.%N) $(awk '/^VmRSS/{print $2}' /proc/$WS/status) $(ps --ppid $WS -o rss= | awk '{s+=$1} END{print s+0}') $(cat test_kind)"
            sleep 0.5
          done > mem.log 2>/dev/null ) &
        SAMPLER=$!
        set +e
        START=$(date +%s)
        # tester prints "Test ..." before each test; .bla in that line means the test goes through CGI
        echo '' | ./tester_42 http://127.0.0.1:9000 | while IFS= read -r line || [ -n "$line" ]; do
          printf '%s\n' "$line"
          case $line in
            *Test*.bla*) echo cgi > test_kind ;;
            *Test*) echo plain > test_kind ;;
          esac
        done
        RC=${PIPESTATUS[1]}
        DUR=$(( $(date +%s) - START ))
        kill $MON $SAMPLER; wait $SAMPLER 2>/dev/null
        echo "tester exit code: $RC"
        if ! kill -0 $WS 2>/dev/null; then echo "webserv died during the test"; RC=1; fi
        # kernel-kept peak RSS; must be read before webserv is killed
        HWM=$(awk '/^VmHWM/{print $2}' /proc/$WS/status 2>/dev/null)
        sudo dmesg 2>/dev/null | grep -iE "out of memory|killed process" | tail -5
        kill $WS 2>/dev/null
        awk -v dur=$DUR -v hwm=${HWM:-0} -v rc=$RC -f .github/mem_report.awk mem.log | tee -a "$GITHUB_STEP_SUMMARY"
        exit $RC

    - name: Upload memory log
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: mem-log
        path: mem.log
