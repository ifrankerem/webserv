<html lang="tr">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>42 Webserv</title>
	<style>
		:root {
			color-scheme: dark;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: radial-gradient(circle at top, #3a4152 0%, #1f232b 45%, #111318 100%);
			color: #f4f7ff;
			font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
		}

		.card {
			width: min(760px, 92vw);
			padding: 36px;
			border-radius: 18px;
			background: rgba(255, 255, 255, 0.06);
			border: 1px solid rgba(255, 255, 255, 0.12);
			backdrop-filter: blur(4px);
			text-align: center;
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
		}

		h1 {
			margin: 0 0 8px;
			font-size: clamp(2rem, 4vw, 2.8rem);
		}

		h2 {
			margin: 0;
			font-size: clamp(1.1rem, 2.5vw, 1.5rem);
			font-weight: 500;
			color: #cdd6f4;
		}

		p {
			margin: 20px 0 0;
			color: #dbe2ff;
			line-height: 1.6;
		}
	</style>
</head>
<body>
	<main class="card">
		<h1>Merhaba Kanka! 👋</h1>
		<h2>Kendi yazdığın C++ sunucuna hoş geldin 🚀</h2>
		<p>
			Eğer bunu görüyorsan soketler, <strong>bind</strong>, <strong>listen</strong>
			ve <strong>accept</strong> başarılı şekilde çalışıyor demektir.
		</p>
	</main>
</body>
</html>
