server {
    listen 127.0.0.1:8080;
    server_name testsite.local;
    client_max_body_size 5M;

    location / {
        root html;
        allow_methods GET POST;
    }
    
    location /zart {
        root html;
        allow_methods GET#yorum
POST;
        index index.html;
        autoindex off;
    }
}
