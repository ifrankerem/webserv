server {
    listen 127.0.0.1:8080;
    server_name localhost;

    client_max_body_size 100;

    location / {
        root YoupiBanane;
        allow_methods GET;
        index youpi.bad_extension;
        autoindex off;
    }

    location /directory {
        alias YoupiBanane;
        allow_methods GET;
        index youpi.bad_extension;
        autoindex off;
    }

    location /post_body {
        root YoupiBanane;
        allow_methods POST;
        index youpi.bad_extension;
        autoindex off;
    }

    location /cgi {
        root YoupiBanane;
        allow_methods GET POST;
        cgi_ext .bla;
        cgi_path ./cgi_tester_42;
    }
}
