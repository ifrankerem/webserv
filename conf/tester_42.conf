server {
    listen 127.0.0.1:9000;
    server_name localhost;

    client_max_body_size 200M;

    # Sadece GET izni
    location / {
        root YoupiBanane;
        allow_methods GET;
        index youpi.bad_extension;
        autoindex off;
    }

    # Tester asıl buraya saldırıyor (GET ve POST izni olmalı, CGI burada çalışmalı)
    location /directory {
        alias YoupiBanane;
        allow_methods GET POST; 
        index youpi.bad_extension;
        autoindex off;
        upload_enable on;
        upload_store YoupiBanane;
        
        # CGI Ayarları buraya eklendi!
        cgi .bla ./cgi_tester_42;
    }

    # 100 byte limitli POST testi
    location /post_body {
        root YoupiBanane;
        allow_methods POST;
        client_max_body_size 100;
        upload_enable on;
        upload_store YoupiBanane;
    }
}