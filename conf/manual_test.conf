# Tarayicidan tiklanarak test edilebilir config
# Kullanim: ./webserv_manual conf/manual_test.conf

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    error_page 404 /errors/404.html;
    error_page 403 /errors/403.html;
    error_page 500 502 503 504 /errors/50x.html;

    client_max_body_size 10M;

    root html;

    location / {
        root html;
        allow_methods GET POST;
        index index.html;
        autoindex off;
    }

    location /upload {
        root html;
        allow_methods GET POST DELETE;
        upload_enable on;
        upload_store html/upload;
    }

    location /cgi {
        root html;
        allow_methods GET POST;
        cgi .py /usr/bin/python3;
    }

    location /listelenecek {
        root html;
        allow_methods GET;
        index yok.html;
        autoindex on;
    }

    location /gizli {
        root html;
        allow_methods GET;
        autoindex off;
        index yok.html;
    }

    location /depo {
        root html;
        allow_methods GET POST;
        index index.html;
        autoindex on;
    }

    location /readonly {
        root html;
        allow_methods GET;
        index index.html;
    }

    location /methodtest {
        root html;
        allow_methods DELETE;
        index index.html;
    }

    location /eski {
        allow_methods GET POST;
        return 301 /index.html;
    }
}
