server {
    listen 127.0.0.1:4242;
    server_name localhost;
    client_max_body_size 10M;
    error_page 404 /404.html;

    location / {
        root demo;
        allow_methods GET POST;
        index index.html;
        cgi .py /usr/bin/python3;
        cgi .php /usr/bin/php-cgi;
    }

    location /uploads {
        root demo;
        allow_methods GET POST DELETE;
        upload_enable on;
        upload_store demo/uploads;
        autoindex on;
    }

    location /limit {
        root demo;
        allow_methods POST;
        client_max_body_size 100;
    }

    location /forbidden {
        root demo;
        allow_methods GET DELETE;
    }

    location /old {
        return 301 /;
    }
}

server {
    listen 127.0.0.1:4243;
    server_name localhost;

    location / {
        root demo/site2;
        allow_methods GET;
        index index.html;
    }
}
