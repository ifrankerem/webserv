server {
    listen               127.0.0.1:8080;
    server_name          localhost example.com;
    client_max_body_size 10m;

    error_page 404              /errors/404.html;
    error_page 500 502 503 504  /errors/50x.html;

    location / {
        root            ./www/html;
        index           index.html;
        allow_methods   GET;
        autoindex       off;
    }

    location /kapouet {
        root            ./www/kapouet;
        allow_methods   GET;
        autoindex       on;
    }

    location /upload {
        root            ./www/upload;
        allow_methods   GET POST DELETE;
        upload_store    ./www/upload;
        autoindex       on;
    }

    location /old {
        return          301 /;
    }

    location /cgi-bin {
        root            ./www/cgi-bin;
        allow_methods   GET POST;
        cgi_extension   .php;
        cgi_pass        /usr/bin/php-cgi;
    }

    location /python {
        root            ./www/cgi-bin;
        allow_methods   GET POST;
        cgi_extension   .py;
        cgi_pass        /usr/bin/python3;
    }
}

server {
    listen               127.0.0.1:8080;
    server_name          other.com;
    client_max_body_size 1m;

    location / {
        root            ./www/other;
        index           index.html;
        allow_methods   GET;
        autoindex       off;
    }
}

server {
    listen               127.0.0.1:9090;
    server_name          localhost;
    client_max_body_size 100k;

    error_page 404      /errors/404.html;

    location / {
        root            ./www/9090;
        index           index.html;
        allow_methods   GET POST DELETE;
        autoindex       on;
    }
}
