server {
    listen 255.255.255.255:8080;
    server_name musyilma.42.fr;

    # Genel ayarlar
    client_max_body_size 5M;
    
    # Hata sayfaları
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;

    # 1. Ana sayfa (Sadece GET ve POST izni)
    location / {
        root html;
        allow_methods GET POST;
        index index.html;
        autoindex off;
    }

    # 2. Alt klasör
    location /altklasor {
        root html;
        allow_methods GET;
        index index.html;
    }

    # 3. Dizin listeleme testi (autoindex on)
    location /depo {
        root html;
        allow_methods GET;
        index index.html;
        autoindex on;
    }

    # 4. İzin verilmeyen metot testi (Örneğin sadece POST izni var, GET atınca 405 dönmeli)
    location /gizli {
        root html;
        allow_methods POST;
    }

    # 5. Dosya Yükleme (Upload) ve Silme (DELETE)
    location /upload {
        root html;
        allow_methods GET POST DELETE;
        autoindex on;
        upload_enable on;
        upload_store html/upload;
        index index.html;

    }

    # 6. CGI Testi (.py uzantılı dosyaları Python ile çalıştırır)
    location .py {
        root html;
        allow_methods GET POST;
        cgi_path /usr/bin/python3;
        cgi_ext .py;
    }

    # 7. Yönlendirme Testi (Redirect)
    location /eski {
        return 301 /altklasor;
    }
}

server {
    # 8. Aynı porta bakan ama farklı host (server_name) olan sunucu (Virtual Host Testi)
    listen 127.0.0.1:8080;
    server_name iarslan.42.fr;

    location / {
        root html;    
        allow_methods GET;
        index index.html;
        autoindex on;
    }
}
