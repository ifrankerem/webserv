#Example config file
server {
    listen 127.0.0.1:8080;
    server_name defaultsitesi.com;

    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    client_max_body_size 10M;

    location / {
        root /var/www/html;                    
        allow_methods GET POST;                
        index index.html index.htm;            
        autoindex off;                         
    }

   
    location /kapouet {
        root /tmp/www;                        
        allow_methods GET;
    }

    
    location /eski-sayfa {
        return 301 /yeni-sayfa;                
    }

    
    location /upload {
        root /var/www/uploads;
        allow_methods GET POST DELETE;
        upload_enable on;                     
        upload_store /var/www/uploads/files;  
    }

    location .php {
        root /var/www/html;
        allow_methods GET POST;
        cgi_path /usr/bin/php-cgi;            
        cgi_ext .php;                          
    }
}

server {
    listen 127.0.0.1:8081;
    server_name digersite.com;

    client_max_body_size 5M;
    error_page 404 /errors/404_ikinci.html;

    location / {
        root /var/www/ikinci_site;
        allow_methods GET;
        autoindex on;                        
    }
}