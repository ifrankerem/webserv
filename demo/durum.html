<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Durum kodları</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header><a href="/">webserv demo</a> / Durum kodları</header>
    <main>
        <section>
            <h2>Durum kodları</h2>
            <p class="muted">Her buton sunucuya gerçek bir istek gönderip dönen durum kodunu gösteriyor.
            Linkler aynı isteği tarayıcıda açıyor.</p>
            <table id="tests"></table>
        </section>
    </main>
    <script>
        const tests = [
            ["200", "GET /index.html", "/index.html", {}],
            ["201", "POST /uploads/durum-testi.txt (ham body)", "/uploads/durum-testi.txt", { method: "POST", body: "durum sayfasindan yuklendi\n" }],
            ["301", "GET /eski (return 301 /)", "/eski", { redirect: "manual" }],
            ["403", "DELETE /yasak/dosya (upload_store yok)", "/yasak/dosya", { method: "DELETE" }],
            ["404", "GET /yok.html (ozel 404 sayfasi)", "/yok.html", {}],
            ["405", "DELETE /index.html (sadece GET ve POST izinli)", "/index.html", { method: "DELETE" }],
            ["413", "POST /limit, 1000 bayt (limit 100)", "/limit", { method: "POST", body: "x".repeat(1000) }],
            ["405", "FOO / (bilinmeyen metot)", "/", { method: "FOO" }],
            ["502", "GET /bozuk.py (syntax hatali CGI)", "/bozuk.py", {}],
            ["504", "GET /sonsuz.py (bitmeyen CGI, ~30 sn surer)", "/sonsuz.py", {}],
        ];

        const table = document.getElementById("tests");
        tests.forEach(([expected, label, url, options], i) => {
            const row = table.insertRow();
            const link = !options.method || options.method === "GET"
                ? '<a href="' + url + '">' + label + '</a>' : label;
            row.innerHTML = "<th>beklenen " + expected + "</th><td>" + link + "</td>"
                + '<td><button type="button">Gönder</button> <span id="r' + i + '"></span></td>';
            row.querySelector("button").addEventListener("click", async () => {
                const out = document.getElementById("r" + i);
                out.textContent = "bekleniyor...";
                try {
                    const res = await fetch(url, options);
                    const code = res.type === "opaqueredirect" ? "301 (yonlendirme)" : res.status + " " + res.statusText;
                    out.textContent = "-> " + code;
                } catch (err) {
                    out.textContent = "-> hata: " + err;
                }
            });
        });
    </script>
</body>
</html>
